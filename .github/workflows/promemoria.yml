# Ogni ora controlla chi deve ricevere il promemoria del mattino.
name: Promemoria
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}
concurrency: { group: promemoria, cancel-in-progress: false }
jobs:
  manda:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: scripts/requisiti.txt }
      - run: pip install -r scripts/requisiti.txt
      - run: python scripts/promemoria.py
        working-directory: scripts
        env:
          FIREBASE_CHIAVE: ${{ secrets.FIREBASE_CHIAVE }}
