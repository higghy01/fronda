# Prepara Firebase (regole, chiavi delle notifiche). Parte da solo quando cambiano le regole, o a mano.
name: Prepara Firebase
on:
  push:
    branches: [main]
    paths: [firestore.rules, scripts/prepara.py]
  workflow_dispatch: {}
concurrency: { group: prepara, cancel-in-progress: false }
jobs:
  prepara:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: scripts/requisiti.txt }
      - run: pip install -r scripts/requisiti.txt
      - run: python prepara.py
        working-directory: scripts
        env:
          FIREBASE_CHIAVE: ${{ secrets.FIREBASE_CHIAVE }}
