<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rigo</title>
<meta name="description" content="Le tue piante di casa: quando annaffiarle, consigli e foto.">
<meta name="theme-color" content="#F2F5EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B120D" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rigo">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icona-180.png?v=17">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- caratteri di riserva per chi non ha un iPhone: caricati senza bloccare la pagina (sull'iPhone si usano quelli di sistema) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="stile.css?v=17">
</head>
<body>
<div class="navbar" id="navbar" aria-hidden="true"><span id="nav-t"></span></div>
<div class="app" id="app">
  <div class="vista on" id="v-oggi" role="tabpanel" aria-label="Oggi"></div>
  <div class="vista" id="v-piante" role="tabpanel" aria-label="Piante"></div>
  <div class="vista" id="v-imp" role="tabpanel" aria-label="Impostazioni"></div>
</div>

<nav class="tabbar" id="tabbar" role="tablist" style="--k:0">
  <span class="tab-ind" aria-hidden="true"></span>
  <button class="tab on" data-tab="oggi" role="tab" aria-selected="true" style="--c:var(--water)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 3.5s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/></svg><span>Oggi</span><i class="tab-n" id="tab-n"></i></button>
  <button class="tab" data-tab="piante" role="tab" aria-selected="false" style="--c:var(--leaf)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21v-8"/><path d="M12 13c0-4 3-7 8-7 0 4-3 7-8 7z"/><path d="M12 15c0-3-2.5-5.5-7-5.5 0 3 2.5 5.5 7 5.5z"/></svg><span>Piante</span></button>
  <button class="tab" data-tab="imp" role="tab" aria-selected="false" style="--c:#8E6CDF">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v2.5M12 19v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.5 12H5M19 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg><span>Impostazioni</span></button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="viewer" id="viewer"></div>
<div class="toast" id="toast" role="status"></div>

<script src="config.js?v=17"></script>
<script src="cure.js?v=17"></script>
<script src="salute.js?v=17"></script>
<script src="disegni.js?v=17"></script>
<script src="app.js?v=17"></script>
</body>
</html>
