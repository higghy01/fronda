    </button>
  </header>
  <main id="main"></main>

<button class="fab" id="open-add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Aggiungi</button>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="viewer" id="viewer"></div>
<div class="toast" id="toast" role="status"></div>

<script src="cure.js?v=1"></script>
<script src="disegni.js?v=1"></script>
